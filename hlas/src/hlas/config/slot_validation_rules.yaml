
fraud:
  purchase_frequency:
    - "Your goal is to normalize how often the user shops online. Accept and normalize to one of: 'daily', 'weekly', 'monthly', 'rarely'."
    - "1. Recognize common phrases: 'every day', 'everyday', '7 days a week' → 'daily'; 'once a week', 'twice a week' → 'weekly'; 'once a month', 'twice a month' → 'monthly'; 'rarely', 'occasionally', 'few times a year', 'seldom' → 'rarely'."
    - "2. If ambiguous or not a frequency, validation fails. Ask: 'How often do you shop online? (daily, weekly, monthly)'."
    - "3. Normalized value must be the lowercase keyword (e.g., 'daily')."
  scam_exp:
    - "Your goal is to determine if the user has experienced or almost fallen for an online scam. Normalize to one of: 'yes', 'almost', 'no'."
    - "1. Accept common variants: 'yes', 'y', 'yep', 'scammed' → 'yes'; 'almost', 'nearly', 'close call' → 'almost'; 'no', 'nope', 'never' → 'no'."
    - "2. If unclear, ask: 'Have you ever experienced or almost fallen for an online scam? (Yes/Almost/No)'."

travel:
  coverage_scope:
    - "Your goal is to determine if the policy should cover one of: 'self', 'family', 'group_adults', or 'group_families'."
    - "1. **Normalize Input**: Map common phrases to these normalized values:
         • 'self'/'myself'/'just me'/'for me'/'solo' → 'self'
         • 'family'/'my family'/'for us'/'family trip' → 'family'
         • 'group of adults'/'adult group'/'group adults'/'friends group' → 'group_adults'
         • 'group of families'/'family group'/'multiple families' → 'group_families'"
    - "2. **Optional Counts**: If a number of people/families is provided, enforce limits: group_adults ≤ 20; group_families ≤ 10. If over the limit, validation fails and you MUST ask the user to stay within the limit."
    - "3. **Handle Failure**: If the input cannot be confidently normalized, ask: 'Please choose: myself, family, group of adults (up to 20), or group of families (up to 10).' Normalize the final answer to one of: 'self', 'family', 'group_adults', 'group_families'."
  destination:
    - "Your goal is to identify and validate a destination country from the user's message."
    - "1. **Validate Country**: Accept ANY valid country name worldwide. The user can provide full country names (e.g., 'France', 'Japan', 'Brazil', 'Egypt') OR common abbreviations. If the user provides an abbreviation, auto-normalize it to the full country name. Common abbreviations include (but are not limited to): US/USA → 'United States', UK → 'United Kingdom', UAE → 'United Arab Emirates', SG/SGP → 'Singapore', MY/MYS → 'Malaysia', TH/THA → 'Thailand', ID/IDN → 'Indonesia', PH/PHL → 'Philippines', VN/VNM → 'Vietnam', JP/JPN → 'Japan', KR/KOR → 'South Korea', CN/CHN → 'China', AU/AUS → 'Australia', NZ/NZL → 'New Zealand', FR/FRA → 'France', DE/DEU → 'Germany', IT/ITA → 'Italy', ES/ESP → 'Spain', CA/CAN → 'Canada'."
    - "2. **Handle Cities/Places**: If the user mentions a city or place (e.g., 'Paris', 'Bali', 'Tokyo'), DO NOT infer the country. Ask explicitly: 'Which country will you be travelling to? Please provide the country name.'"
    - "3. **Handle Multiple Countries**: If the user mentions multiple countries (e.g., 'France and Spain'), ask them to specify the primary destination: 'That sounds like a great trip! Which country will you be spending the most time in?'"
    - "4. **Handle Invalid Input**: If the input is not a country name, ask: 'Could you please tell me which country you'll be travelling to?'"
    - "5. **Handle 'I Don't Know'**: If the user says they don't know, provide a brief explanation and ask: 'I need to know which country you're travelling to so I can recommend the right coverage for you. Which country will you be visiting?'"
    - "6. **Normalize**: Always normalize to the standard English country name (e.g., 'United States' not 'USA', 'United Kingdom' not 'UK'). For known abbreviations, normalize them to full names. Do NOT derive a country from city/place names."
    - "Strictly ignore any other information like dates or durations."

maid:
  duration_of_insurance:
    - "Your goal is to determine the insurance duration. The only valid normalized values are '12' (for 12 months/1 year) or '24' (for 24 months/2 years)."
    - "1. **Normalize Input**: Convert the user's input into '12' or '24'. Understand and accept natural language like '1 year', 'one year', '12 months' for '12', and '2 years', 'two years', '24 months' for '24'."
    - "2. **Handle Ambiguity/Invalid Input**: If the user provides any other duration, or if the input is unclear, you must ask for a clear choice between the two valid options: 'We offer 12-month and 24-month policies. Which duration would you prefer?'"
    - "3. **Handle 'I Don't Know'**: If the user says they 'don't know', provide a brief explanation and ask for a choice: 'No problem! The policy duration determines how long your helper will be covered. We offer 12-month and 24-month policies. Which option works better for you?'"
  maid_country:
    - "Your goal is to identify and validate the maid's country of origin."
    - "1. **Validate Country**: Accept ANY valid country name worldwide. The user can provide full country names, common variations, colloquial terms, OR standard abbreviations. Auto-normalize to the full country name. Examples (NOT exhaustive): 'PH'/'Philippines'/'Pinoy' → 'Philippines', 'US'/'USA' → 'United States'. Accept similar abbreviations for all countries. Do NOT infer the country from city or place names."
    - "2. **Handle Invalid Input**: If the input is not a recognizable country, ask: 'Could you please tell me which country your helper is from?'"
    - "3. **Handle 'I Don't Know'**: If the user says they don't know, provide a brief explanation and ask: 'I need to know your helper's country of origin to recommend the right coverage. Which country are they from?'"
    - "4. **Normalize**: Always normalize to the standard English country name (e.g., 'Pinoy' → 'Philippines', 'US' → 'United States')."
  coverage_above_mom_minimum:
    - "Your goal is to determine if the user wants coverage higher than the legal minimum. The only valid normalized values are 'yes' or 'no'."
    - "1. **Normalize Input**: Convert user's input into a strict 'yes' or 'no'. Be flexible with user phrasing. Accept affirmative responses ('yes', 'yep', 'sure', 'want more', 'beyond minimum') → normalize to 'yes'. Accept negative responses ('no', 'nope', 'basic is fine', 'minimum only') → normalize to 'no'."
    - "2. **Handle Ambiguity**: If the user's response is unclear (e.g., 'is it expensive?'), re-ask the question clearly: 'To clarify, would you like coverage for medical expenses beyond the legal minimum requirement? (Yes/No)'"
    - "3. **Handle 'I Don't Know'**: If the user says they 'don't know', provide a brief explanation and ask for a choice: 'No problem! The Ministry of Manpower (MOM) requires a minimum level of medical coverage for helpers. We offer plans that go beyond this minimum for greater protection. Would you like to include this higher coverage? (Yes/No)'"
  add_ons:
    - "Your goal is to determine if the user is interested in optional add-on coverages. The only valid normalized values are 'required' or 'not_required'."
    - "1. **Normalize Input**: Convert user's input into 'required' or 'not_required'. Be flexible with user phrasing. Accept affirmative responses ('yes', 'yep', 'sure', 'interested', 'want add-ons') → normalize to 'required'. Accept negative responses ('no', 'nope', 'not interested', 'no extras') → normalize to 'not_required'."
    - "2. **Handle Ambiguity**: If the user's response is unclear, re-ask the question clearly: 'Just to be sure, are you interested in learning about optional add-ons for greater coverage? (Yes/No)'"
    - "3. **Handle 'I Don't Know'**: If the user says they 'don't know' or asks what they are, provide a brief explanation and ask for a clear choice: 'No problem! Optional add-ons include benefits like increased hospital expense limits and coverage for medical check-ups. Are you interested in these extra coverages? (Yes/No)'"

personalaccident:
  coverage_scope:
    - "Your goal is to determine if the policy should cover just the individual ('self') or their family."
    - "1. **Normalize Input**: Attempt to normalize the user's input to either 'self' or 'family'. Synonyms for 'self' include 'just me' and 'myself'. Synonyms for 'family' include 'my whole family' and 'for us'."
    - "2. **Handle Failure**: If the input cannot be confidently normalized to 'self' or 'family' (e.g., it is ambiguous like 'the adults' or invalid like 'my friend'), validation fails. You MUST ask a direct, non-yes/no question that guides the user to choose one of the two valid options. For example: 'Please specify if the coverage is for yourself or for your family.'"
  risk_level:
    - "Your goal is to determine if the user's occupational risk is 'high' or 'low'."
    - "1. **Normalize/Classify Input**: First, attempt to normalize a direct answer like 'high' or 'low'. Accept common variants and hyphenations: 'high risk', 'high-risk', 'highrisk' → 'high'; 'low risk', 'low-risk', 'lowrisk' → 'low' (case-insensitive). If the user provides their occupation instead (e.g., 'driver', 'accountant'), you MUST classify it into 'high' or 'low' risk based on these guidelines: manual labor or non-office jobs are 'high' risk; administrative or office-based jobs are 'low' risk."
    - "2. **Handle Failure**: If the input is ambiguous ('it depends') or you cannot confidently classify the provided occupation, validation fails. You MUST then ask for the user's occupation directly so you can classify it. For example: 'To determine the risk level, could you please tell me your occupation?'"
  desired_amount:
    - "Your goal is to validate the desired coverage amount is a number between 500 and 3500."
    - "0. **Preference Phrases (no number given)**: If the user expresses a directional preference, map it to a boundary value:
         • 'the higher the better', 'highest', 'max', 'maximum', 'as high as possible', 'best coverage' → '3500'
         • 'the lower the better', 'lowest', 'min', 'minimum', 'as low as possible', 'budget' → '500'"
    - "1. **Normalize Input**: Extract digits from the user's input; accept currency symbols and commas (e.g., '$2,500' → '2500'). Also accept approximations like 'about 3k' → '3000'."
    - "2. **Validate Range**: After normalization, check the number falls within 500 to 3500, inclusive."
    - "3. **Handle Failure**: If the input is not numeric after normalization or is outside the valid range, validation fails. Your question MUST explain the error and state the valid range. For example: 'The amount you provided is not valid. Please provide an amount between $500 and $3,500.'"
    - "If valid, the `normalized_value` must be the number as a string (e.g., '1500')."

home:
  risk_concerns:
    - "Your goal is to identify and normalize the user's specific home risk concerns. Valid concerns are: 'fire', 'water damage', 'theft'."
    - "1. **Normalize Input**: Accept single or multiple concerns. Normalize synonyms: 'burglary', 'break-in', 'stolen' → 'theft'; 'flood', 'leak', 'water', 'pipe burst' → 'water damage'; 'fire', 'fires' → 'fire'."
    - "2. **Handle 'All'**: If the user says 'all', 'everything', 'both', or similar, normalize to 'fire, water damage, theft'."
    - "3. **Format**: The normalized_value MUST be a single comma-separated string of concerns in this order when present: 'fire, water damage, theft'. Do not include duplicates."
    - "4. **Handle Invalid/Ambiguous**: If none of the valid concerns can be identified, ask: 'Do you have any specific worries such as fire, water damage or theft? You can mention more than one.'"
  coverage_amount:
    - "Your goal is to validate the estimated total value of renovations, home contents and valuables."
    - "1. **Normalize Input**: Extract digits; accept formats with $, commas, spaces (e.g., '$150,000' → '150000')."
    - "2. **Validate**: The value must be a positive integer (> 0)."
    - "3. **Handle Failure**: If not a positive integer, ask: 'Could you share an estimated total value for renovations, contents and valuables (e.g., 150000)?'"
    - "If valid, the `normalized_value` must be the number as a string (e.g., '200000')."

early:
  existing_cover:
    - "Your goal is to determine if the user already has any insurance that pays a lump sum on diagnosis of a critical illness. Normalize to 'yes' or 'no'."
    - "1. **Normalize Input**: Accept variants like 'yes', 'y', 'yep', 'sure' → 'yes'; 'no', 'nope', 'nah' → 'no'."
    - "2. **Handle Ambiguity**: If unclear, ask: 'Do you already have any insurance that pays a lump sum if you’re diagnosed with a critical illness? (Yes/No)'"
  dependants:
    - "Your goal is to determine if the user has family members who rely on their income or care. Normalize to 'yes' or 'no'."
    - "1. **Normalize Input**: Accept variants like 'yes', 'y', 'yep', 'sure' → 'yes'; 'no', 'nope', 'nah' → 'no'."
    - "2. **Handle Ambiguity**: If unclear, ask: 'Do you have family members who rely on your income or care? (Yes/No)'"

hospital:
  age:
    - "Your goal is to capture the user's age or age range. Accept a reasonable age (e.g., 18–100) or one of: 'below 25', '25-35', '36-45', 'above 45'."
    - "1. **Normalize Input**: If a number is provided, extract digits (e.g., 'I'm 28' → '28'). If a range/label is provided, keep the label as-is."
    - "2. **Validate**: If numeric age is < 15 or > 110, treat as invalid."
    - "3. **Handle Failure**: Ask: 'May I know how old you are? (below 25, 25-35, 36-45, above 45 or a number)'"
  occupation:
    - "Your goal is to record a short free-text occupation description."
    - "1. **Validate**: Accept any non-empty job-like phrase (e.g., 'teacher', 'software engineer', 'driver')."
    - "2. **Handle Failure**: Ask: 'What best describes your occupation?'"
  support:
    - "Your goal is to determine if the user is supporting anyone financially. Normalize to 'yes' or 'no'."
    - "1. **Normalize Input**: Accept variants like 'yes', 'y', 'yep', 'sure' → 'yes'; 'no', 'nope', 'nah' → 'no'."
    - "2. **Handle Ambiguity**: Ask: 'Are you currently supporting anyone financially (e.g., Spouse, Children, Parents)? (Yes/No)'"
  coverage:
    - "Your goal is to validate the desired daily hospital cash coverage. Normalize to one of: '100', '200', '300'."
    - "1. **Normalize Input**: Extract digits from input; accept formats like '$200/day', '200 per day' (→ '200')."
    - "2. **Validate**: If the number is not 100, 200, or 300, validation fails."
    - "3. **Handle Failure**: Ask: 'How much daily coverage are you comfortable with? Please choose $100/day, $200/day, or $300/day.'"
    - "If valid, the `normalized_value` must be the number as a string (e.g., '200')."
