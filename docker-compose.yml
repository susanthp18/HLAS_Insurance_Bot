version: "3.9"

name: hlas

services:
  caddy:
    image: caddy:2.8
    container_name: hlas-caddy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      hlas-api:
        condition: service_healthy
    networks: [app]

  hlas-api:
    image: hlas-api:1.0.0
    container_name: hlas-api
    restart: unless-stopped
    env_file:
      - ./.env.hlas
    environment:
      - REDIS_URL=redis://redis:6379/0
      - WEAVIATE_URL=http://weaviate:8080
      - MONGO_URI=mongodb://susanth18:ChangeMe_sUsAnTh_%212025_DB@mongo:27017/?authSource=admin
      - LOG_FILE=/var/log/hlas/app.log
    volumes:
      - hlas-logs:/var/log/hlas
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [app]

  redis:
    image: redis:7.2-alpine
    container_name: hlas-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [app]

  mongo:
    image: mongo:7
    container_name: hlas-mongo
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=susanth18
      - MONGO_INITDB_ROOT_PASSWORD=ChangeMe_sUsAnTh_!2025_DB
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    networks: [app]

  weaviate:
    image: semitechnologies/weaviate:1.25.5
    container_name: hlas-weaviate
    restart: unless-stopped
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - DEFAULT_VECTORIZER_MODULE=none
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
    ports:
      - "8080:8080"
    volumes:
      - weaviate-data:/var/lib/weaviate
    networks: [app]

volumes:
  redis-data: {}
  mongo-data: {}
  mongo-config: {}
  weaviate-data: {}
  hlas-logs: {}

networks:
  app: {}


